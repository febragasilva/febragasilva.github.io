<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="800" fill="url(#bg)"/>
  <!-- Abstract DNA/molecular pattern -->
  <g opacity="0.08" fill="none" stroke="#fff" stroke-width="1.5">
    <path d="M200,100 Q400,200 300,400 Q200,600 400,700"/>
    <path d="M250,100 Q450,200 350,400 Q250,600 450,700"/>
    <path d="M1500,50 Q1700,150 1600,350 Q1500,550 1700,750"/>
    <path d="M1550,50 Q1750,150 1650,350 Q1550,550 1750,750"/>
    <!-- Connection lines -->
    <line x1="300" y1="200" x2="350" y2="200"/>
    <line x1="280" y1="400" x2="330" y2="400"/>
    <line x1="320" y1="600" x2="370" y2="600"/>
    <line x1="1600" y1="150" x2="1650" y2="150"/>
    <line x1="1580" y1="350" x2="1630" y2="350"/>
    <line x1="1620" y1="550" x2="1670" y2="550"/>
  </g>
  <!-- Subtle dots -->
  <g opacity="0.05" fill="#fff">
    <circle cx="100" cy="300" r="3"/>
    <circle cx="500" cy="150" r="2"/>
    <circle cx="800" cy="650" r="3"/>
    <circle cx="1200" cy="200" r="2"/>
    <circle cx="1400" cy="600" r="3"/>
    <circle cx="1800" cy="400" r="2"/>
    <circle cx="600" cy="500" r="2"/>
    <circle cx="1000" cy="100" r="3"/>
    <circle cx="1700" cy="300" r="2"/>
    <circle cx="300" cy="700" r="2"/>
  </g>
</svg>
